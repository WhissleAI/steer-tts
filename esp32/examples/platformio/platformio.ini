; SteerTTS Nano on an ESP32-S3 with 8 MB flash and no PSRAM (Arduino-ESP32 2.0.17 = ESP-IDF 4.4).
;   pio run -e speak -t upload -t monitor     speak a sentence to an I2S amplifier (src/speak)
;   pio run -e bench -t upload -t monitor     the benchmark: prints CHECK| / RESULT| lines (src/bench)
; Write nano.bin and front.bin to the steertts partition once, see ../../README.md.
[platformio]
default_envs = speak, bench

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = ../../partitions.csv
build_flags =
    -DCONFIG_NANO_BENCH_SECONDS=10
    -DCONFIG_NANO_BENCH_TASK_STACK=12288
lib_deps =
    steertts_nano=symlink://../../components/steertts_nano
monitor_speed = 115200

[env:speak]
build_src_filter = +<speak/>

[env:bench]
build_src_filter = +<bench/>
